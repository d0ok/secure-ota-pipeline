<svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="980" height="560" fill="#ffffff"/>
  <text x="490" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Secure OTA pipeline: build, SBOM, sign, deploy</text>

  <!-- CI boundary -->
  <rect x="20" y="50" width="640" height="330" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="34" y="72" font-weight="bold" fill="#475569">GitHub Actions (CI/CD)</text>

  <rect x="40" y="95" width="130" height="64" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="105" y="122" text-anchor="middle" font-weight="bold">1. Build</text>
  <text x="105" y="142" text-anchor="middle" fill="#334155">firmware.bin</text>

  <rect x="200" y="95" width="130" height="64" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="265" y="122" text-anchor="middle" font-weight="bold">2. SBOM</text>
  <text x="265" y="142" text-anchor="middle" fill="#334155">CycloneDX + Grype</text>

  <rect x="360" y="95" width="130" height="64" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="425" y="122" text-anchor="middle" font-weight="bold">3. Sign (GPG)</text>
  <text x="425" y="142" text-anchor="middle" fill="#334155">gated environment</text>

  <rect x="520" y="95" width="120" height="64" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="580" y="122" text-anchor="middle" font-weight="bold">4. Package</text>
  <text x="580" y="142" text-anchor="middle" fill="#334155">tar.gz + manifest</text>

  <line x1="170" y1="127" x2="198" y2="127" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="330" y1="127" x2="358" y2="127" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="490" y1="127" x2="518" y2="127" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="360" y="215" width="130" height="60" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="425" y="240" text-anchor="middle" font-weight="bold">Signing key</text>
  <text x="425" y="260" text-anchor="middle" fill="#334155">GitHub secret</text>
  <line x1="425" y1="215" x2="425" y2="161" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="40" y="215" width="290" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="185" y="240" text-anchor="middle" font-weight="bold">Repo inputs</text>
  <text x="185" y="260" text-anchor="middle" fill="#334155">firmware/, sbom/components.json, public key</text>
  <line x1="105" y1="215" x2="105" y2="161" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="265" y1="215" x2="265" y2="161" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="34" y="320" fill="#475569">Package contents: firmware.bin, firmware.bin.sig, firmware.bin.sha256, sbom.cdx.json, manifest.json</text>
  <text x="34" y="342" fill="#475569">Stage 5 (deploy) also runs negative tests: tampered firmware and untrusted signer must be rejected.</text>

  <!-- Backend -->
  <rect x="700" y="50" width="260" height="330" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="714" y="72" font-weight="bold" fill="#475569">Mock vehicle backend</text>

  <rect x="720" y="95" width="220" height="60" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="830" y="120" text-anchor="middle" font-weight="bold">POST /api/v1/updates</text>
  <text x="830" y="140" text-anchor="middle" fill="#334155">upload endpoint</text>

  <rect x="720" y="175" width="220" height="110" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="830" y="197" text-anchor="middle" font-weight="bold">Verification gate</text>
  <text x="830" y="218" text-anchor="middle" fill="#334155">manifest hash matches</text>
  <text x="830" y="236" text-anchor="middle" fill="#334155">GPG sig vs trusted keyring</text>
  <text x="830" y="254" text-anchor="middle" fill="#334155">SBOM hash matches firmware</text>
  <text x="830" y="272" text-anchor="middle" fill="#334155">no duplicate version</text>

  <rect x="720" y="305" width="220" height="55" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="830" y="328" text-anchor="middle" font-weight="bold">Update store</text>
  <text x="830" y="347" text-anchor="middle" fill="#334155">accepted versions + verification.json</text>

  <line x1="830" y1="155" x2="830" y2="173" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="830" y1="285" x2="830" y2="303" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- package to backend -->
  <path d="M580 161 L580 190 L690 190 L690 125 L718 125" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="640" y="208" fill="#334155" font-size="12">HTTP upload</text>

  <!-- Vehicle -->
  <rect x="700" y="420" width="260" height="110" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="714" y="442" font-weight="bold" fill="#475569">Simulated vehicle (ECU client)</text>
  <text x="714" y="464" fill="#334155">Re-verifies with its own pinned key:</text>
  <text x="714" y="480" fill="#334155">hash, signature, SBOM binding,</text>
  <text x="714" y="496" fill="#334155">anti-rollback. A/B slots, self-test</text>
  <text x="714" y="512" fill="#334155">and rollback. Not simulated: see gaps.</text>
  <line x1="830" y1="360" x2="830" y2="418" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="840" y="395" fill="#334155" font-size="12">download package</text>

  <!-- Legend -->
  <rect x="20" y="420" width="640" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="34" y="442" font-weight="bold" fill="#475569">Trust model</text>
  <text x="34" y="466" fill="#334155">The private key exists only in the gated signing job. The matching public key is committed to the repo</text>
  <text x="34" y="484" fill="#334155">and pinned independently by the backend and the vehicle. The vehicle does not trust the backend.</text>
  <text x="34" y="508" fill="#334155">UN R156 mapping: docs/UN_R156_gap_analysis.md</text>
</svg>
